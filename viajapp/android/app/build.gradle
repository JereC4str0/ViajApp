plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" version "4.4.1" apply true
}

android {
    namespace "com.example.altermundi_viajapp"
    compileSdk = flutter.compileSdkVersion // Versión del SDK de compilación
    ndkVersion = flutter.ndkVersion // Versión de NDK de Flutter

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // Compatibilidad con Java 17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17" // Configuración del compilador de Kotlin
    }

    defaultConfig {
        applicationId "com.example.altermundi_viajapp" // ID de la aplicación
        minSdk = 23 // Versión mínima del SDK
        targetSdk = flutter.targetSdkVersion // Versión objetivo del SDK
        versionCode flutter.versionCode // Código de versión
        versionName flutter.versionName // Nombre de versión
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug // Configuración de firma
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0') // Firebase BOM
    implementation 'com.google.firebase:firebase-analytics' // Firebase Analytics
}

flutter {
    source '../..' // Ruta al código fuente de Flutter
}
